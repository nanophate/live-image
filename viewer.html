<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Living Image Player</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="wordmark" href="/">Living Image</a>
        <span class="topbar-label">Runtime / Player</span>
        <a class="text-link" href="/inspect.html">Open inspector</a>
      </header>
      <section class="workspace">
        <div class="stage-panel">
          <canvas id="character-canvas" width="768" height="768" aria-label="Animated character"></canvas>
          <div class="stage-badge" id="render-status">Waiting for a .limg</div>
        </div>
        <aside class="control-panel">
          <div>
            <p class="eyebrow">Portable character runtime</p>
            <h1 id="character-name">Load a character</h1>
            <p class="muted" id="character-meta">The player accepts a local .limg file; nothing is uploaded.</p>
          </div>
          <div class="load-row">
            <label class="file-button">Load .limg<input id="file-input" type="file" accept=".limg,application/json" /></label>
            <button class="secondary" id="sample-teal" type="button">Teal sample</button>
            <button class="secondary" id="sample-copper" type="button">Copper sample</button>
          </div>
          <div class="quick-actions">
            <button id="blink-button" type="button">Blink</button>
            <button id="talk-button" type="button">Mouth pulse</button>
            <button id="reset-button" class="secondary" type="button">Reset</button>
          </div>
          <label class="toggle-row"><span>Automatic idle</span><input id="auto-idle" type="checkbox" checked /></label>
          <div class="control-grid" id="control-grid">
            <label>Left blink <output id="blinkLeft-output">0.00</output><input aria-label="Left blink" data-control="blinkLeft" type="range" min="0" max="1" step="0.01" value="0" /></label>
            <label>Right blink <output id="blinkRight-output">0.00</output><input aria-label="Right blink" data-control="blinkRight" type="range" min="0" max="1" step="0.01" value="0" /></label>
            <label>Gaze X <output id="gazeX-output">0.00</output><input aria-label="Gaze X" data-control="gazeX" type="range" min="-1" max="1" step="0.01" value="0" /></label>
            <label>Gaze Y <output id="gazeY-output">0.00</output><input aria-label="Gaze Y" data-control="gazeY" type="range" min="-1" max="1" step="0.01" value="0" /></label>
            <label>Mouth <output id="mouthOpen-output">0.00</output><input aria-label="Mouth" data-control="mouthOpen" type="range" min="0" max="1" step="0.01" value="0" /></label>
            <label>Breath <output id="breath-output">0.00</output><input aria-label="Breath" data-control="breath" type="range" min="-1" max="1" step="0.01" value="0" /></label>
          </div>
          <div class="quality-card" id="quality-card" hidden></div>
        </aside>
      </section>
    </main>
    <script type="module" src="/src/ui/viewer.ts"></script>
  </body>
</html>
